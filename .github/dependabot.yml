version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let new releases age before proposing them (supply-chain hygiene).
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      androidx-and-kotlin:
        patterns: ["androidx.*", "org.jetbrains.kotlin*", "com.android.*"]
      other:
        patterns: ["*"]
